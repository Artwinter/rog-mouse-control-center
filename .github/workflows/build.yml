name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build with the .NET Framework compiler
        shell: pwsh
        run: .\build\build.ps1 -Out dist\ROGMouseControlCenter.exe

      - name: Show artifact info
        shell: pwsh
        run: |
          $f = Get-Item dist\ROGMouseControlCenter.exe
          Write-Host ("size = {0:N0} bytes" -f $f.Length)
          Get-FileHash $f.FullName -Algorithm SHA256 | Format-List

      - uses: actions/upload-artifact@v4
        with:
          name: ROGMouseControlCenter
          path: dist\ROGMouseControlCenter.exe
          if-no-files-found: error
